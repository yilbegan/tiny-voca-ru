[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-voca-ru"
version = "0.2.1"
description = "A lightweight 4.5M-parameter Russian text-to-speech model"
readme = "README.md"
authors = [{ name = "Evgeniy Chetvertkov" }]
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "src/tiny_voca_ru/frontend/data/LICENSE-ruaccent",
]
requires-python = ">=3.11"
keywords = ["tts", "text-to-speech", "russian", "onnx", "speech-synthesis", "tiny-voca"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24,<3"]

[project.urls]
Homepage = "https://github.com/yilbegan/tiny-voca-ru"
Repository = "https://github.com/yilbegan/tiny-voca-ru"
Model = "https://huggingface.co/egnch/tiny-voca-ru"
Dataset = "https://huggingface.co/datasets/egnch/tiny-voca-ru-dataset"
Demo = "https://huggingface.co/spaces/egnch/tiny-voca-ru-demo"

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17,<2", "soundfile>=0.12,<1", "huggingface-hub>=0.34,<3"]
torch = [
    "torch>=2.4,<3",
    "safetensors>=0.4,<1",
    "soundfile>=0.12,<1",
    "onnxruntime>=1.17,<2",
    "onnx>=1.15,<2",
    "huggingface-hub>=0.34,<3",
]
train = [
    "torch>=2.4,<3",
    "safetensors>=0.4,<1",
    "soundfile>=0.12,<1",
    "onnxruntime>=1.17,<2",
    "librosa>=0.10.2,<1",
    "transformers>=5.10,<6",
    "torchaudio>=2.1,<3",
    "scipy>=1.10,<2",
    "huggingface-hub>=0.34,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "basedpyright>=1.28",
    "num2words>=0.5.14,<0.6",
]

[project.scripts]
tiny-voca-ru-speak = "tiny_voca_ru.infer:main"
tiny-voca-ru-export = "tiny_voca_ru.export:main"
tiny-voca-ru-convert = "tiny_voca_ru.checkpoint:main"
tiny-voca-ru-prepare = "tiny_voca_ru.train.prepare:main"
tiny-voca-ru-train = "tiny_voca_ru.train.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tiny_voca_ru = ["frontend/data/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/tiny_voca_ru/frontend/tables.py" = ["E501"]
"tests/test_web.py" = ["E501"]
[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "checkpoints", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
